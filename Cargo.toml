[package]
name = "KMCU"
version = "0.1.0"
edition = "2024"

[features]
default = ["log"]

std = []
log = ["pretty_env_logger"]
platform_linux = ["std"]

[dependencies]
heapless = "0.9.3"
static_init = "1.0.4"
libc = "0.2"

uom = {version = "0.38.0", default-features = false, features = ["serde", "u32"]}

serde = {version = "1.0.229", features = ["derive"]}
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.3"

# For decompressing ZLIB on klipper printers
# flate2 = {version = "1.1.9", features = ["zlib"]}
miniz_oxide = "0.9.1"

# Logging
log = "0.4.33"
pretty_env_logger = {version = "0.5.0", optional = true}
