[package]
name = "KMCU"
version = "0.1.0"
edition = "2024"

[features]
default = ["log", "platform_linux"]

std = []
log = ["pretty_env_logger"]
platform_linux = ["std", "dep:libc"]

[dependencies]
heapless = "0.9.3"
static_init = "1.0.4"
libc = { version = "0.2.189", optional = true }

uom = {version = "0.38.0", default-features = false, features = ["serde", "u32"]}

toml = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }

# For decompressing ZLIB on klipper printers
miniz_oxide = "0.9.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# Logging
log = "0.4.33"
pretty_env_logger = {version = "0.5.0", optional = true}

[profile.release]
strip = true             # Strip symbols from the binary
opt-level = "z"          # Optimize for size
lto = true               # Link tree optimization
codegen-units = 1
panic = "abort"
debug = false            # Remove debug
# trim-paths="all"
